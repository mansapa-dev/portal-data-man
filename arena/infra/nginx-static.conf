# Include in the Arena server block with root pointing to apps/web/dist.
# Only public content-hashed Vite assets belong under /assets/.
location ^~ /assets/ {
  try_files $uri =404;
  add_header Cache-Control "public, max-age=31536000, immutable";
  add_header X-Content-Type-Options nosniff always;
}
location = /index.html {
  add_header Cache-Control "no-cache" always;
}
# Retain the existing SPA try_files fallback and /api, /auth, /health proxy
# locations. Do not cache uploaded question images or authenticated responses.
