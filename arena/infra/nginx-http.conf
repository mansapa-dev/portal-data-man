# Include in nginx http context.
upstream cbt_api {
  least_conn;
  server 127.0.0.1:3001 max_fails=3 fail_timeout=10s;
  server 127.0.0.1:3002 max_fails=3 fail_timeout=10s;
  server 127.0.0.1:3003 max_fails=3 fail_timeout=10s;
  keepalive 128;
}

# Alias for backwards-compatibility with existing configurations
upstream arena_api {
  least_conn;
  server 127.0.0.1:3001 max_fails=3 fail_timeout=10s;
  server 127.0.0.1:3002 max_fails=3 fail_timeout=10s;
  server 127.0.0.1:3003 max_fails=3 fail_timeout=10s;
  keepalive 128;
}

log_format arena_main '$remote_addr - $request_method $uri $status $body_bytes_sent $request_time';
access_log /var/log/nginx/arena-access.log arena_main buffer=256k flush=5s;
