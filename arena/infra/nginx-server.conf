# Include in the Arena server block; place before the catch-all location.

# Static Question Images served directly by Nginx (bypasses Node.js event loop)
# Strict regex: only 64 hex characters + allowed extension. Zero path traversal,
# no access to dotfiles, source code, or dumps.
location ~* ^/api/question-images/([0-9a-f]{64}\.(png|jpg|jpeg|webp|gif))$ {
  alias /srv/arena/storage/question-images/$1;
  expires 1y;
  add_header Cache-Control "public, max-age=31536000, immutable";
  add_header X-Content-Type-Options nosniff always;
  try_files "" =404;
}

# Student exam endpoints (SSE streaming for waiting room, live autosaves, submits)
# Penting: prefix di sini TIDAK boleh diakhiri garis miring.
location ^~ /api/student/exams {
  access_log off;
  proxy_http_version 1.1;
  proxy_buffering off;
  proxy_cache off;
  proxy_read_timeout 75s;
  proxy_connect_timeout 5s;
  proxy_send_timeout 30s;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_pass http://cbt_api;
}

# Fast health & readiness probes
location = /health {
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_connect_timeout 2s;
  proxy_read_timeout 2s;
  proxy_pass http://cbt_api;
}

location = /ready {
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_connect_timeout 2s;
  proxy_read_timeout 5s;
  proxy_pass http://cbt_api;
}

# Generic API proxy
location /api/ {
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_connect_timeout 5s;
  proxy_send_timeout 30s;
  proxy_read_timeout 60s;
  proxy_pass http://cbt_api;
}
