# Include in the Arena server block; place before the catch-all location.
#
# Penting: prefix di sini TIDAK boleh diakhiri garis miring. Location
# `^~ /api/student/exams/` membuat nginx mengalihkan (301) permintaan
# `/api/student/exams` ke `/api/student/exams/`, sedangkan Fastify hanya
# mendaftarkan route tanpa garis miring → 404 "Route GET:/api/student/exams/
# not found" dan daftar ujian siswa gagal dimuat. Prefix tanpa garis miring
# melayani kedua bentuk path tanpa pengalihan.
location ^~ /api/student/exams {
  access_log off;
  proxy_http_version 1.1;
  proxy_buffering off;
  proxy_cache off;
  proxy_read_timeout 75s;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_pass http://arena_api;
}
