services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: arena-dev-root-only
      MYSQL_DATABASE: arena
      MYSQL_USER: arena_app
      MYSQL_PASSWORD: arena-dev-only
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - arena_dev_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - arena_dev_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  arena_dev_mysql:
  arena_dev_redis:
