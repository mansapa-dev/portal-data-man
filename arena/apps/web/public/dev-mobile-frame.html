<!doctype html>
<!-- Harness pengembangan: kerangka ponsel untuk menguji tampilan mobile di layar desktop.
     Hapus sebelum rilis. -->
<html>
<head>
<meta charset="utf-8">
<title>Mobile frame</title>
<style>
  body{margin:0;background:#52565b;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px}
  #phone{width:390px;background:#000;border-radius:38px 38px 0 0;padding:40px 0 0;position:relative;box-shadow:0 18px 50px #0008;flex:none}
  #phone:before{content:"";position:absolute;top:12px;left:50%;transform:translateX(-50%);width:110px;height:22px;border-radius:12px;background:#000;z-index:99}
  #app{width:390px;height:760px;border:0;border-radius:0 0 30px 30px;background:#fff;display:block}
  .hint{color:#ddd;font-size:12px}
</style>
</head>
<body>
  <div id="phone"><iframe id="app" src="/"></iframe></div>
  <div class="hint">Harness uji mobile — ubah lebar lewat console: document.getElementById('app').style.width='360px'</div>
</body>
</html>
