  <div class="modal" id="modalSoal">

          </div>

          <div style="display:flex; gap:8px;">
            <input type="text" id="inGambarSoalUrl" aria-label="Alamat gambar soal" placeholder="Atau path gambar lokal: assets/img/contoh.png" oninput="handleGambarSoalUrlInput(this.value)" style="width:100%; padding:7px 10px; border:1px solid var(--border); background:var(--surface)" class="ui-control">
          </div>

              <small style="color:var(--text-muted); font-size:10.5px;">Gambar ini akan disematkan pada soal</small>
            </div>
            <button type="button" class="ui-button btn btn-danger" style="padding:4px 8px" onclick="hapusGambarSoalModal()">
              <i class="fa-solid fa-trash"></i> Hapus
            </button>
          </div>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">

            <label class="ui-label" for="inOpsiA">Opsi A</label>

          </div>
          <div class="input-group">
            <label class="ui-label" for="inOpsiB">Opsi B</label>
            <div class="input-wrapper"><div id="inOpsiB" contenteditable="true" role="textbox" data-placeholder="Jawaban B" class="ui-control question-visual-editor"></div></div>
            <div class="question-format-toolbar"><button type="button" onclick="wrapQuestionContent('inOpsiB','<sup>','</sup>','2')">x<sup>2</sup></button><button type="button" onclick="wrapQuestionContent('inOpsiB','<sub>','</sub>','2')">x<sub>2</sub></button><button type="button" onclick="insertQuestionEquation('inOpsiB')">Equation</button><button type="button" aria-label="Tambah gambar opsi B" onclick="document.getElementById('inOpsiBImage').click()"><i class="fa-solid fa-image"></i> Gambar</button><input type="file" id="inOpsiBImage" accept="image/*,.jfif,.jpe,.dib,.tif,.tiff,.heic,.heif" hidden onchange="handleQuestionContentImage(this,'inOpsiB')"></div>
          </div>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
          <div class="input-group">
            <label class="ui-label" for="inOpsiC">Opsi C</label>
            <div class="input-wrapper"><div id="inOpsiC" contenteditable="true" role="textbox" data-placeholder="Jawaban C" class="ui-control question-visual-editor"></div></div>
            <div class="question-format-toolbar"><button type="button" onclick="wrapQuestionContent('inOpsiC','<sup>','</sup>','2')">x<sup>2</sup></button><button type="button" onclick="wrapQuestionContent('inOpsiC','<sub>','</sub>','2')">x<sub>2</sub></button><button type="button" onclick="insertQuestionEquation('inOpsiC')">Equation</button><button type="button" aria-label="Tambah gambar opsi C" onclick="document.getElementById('inOpsiCImage').click()"><i class="fa-solid fa-image"></i> Gambar</button><input type="file" id="inOpsiCImage" accept="image/*,.jfif,.jpe,.dib,.tif,.tiff,.heic,.heif" hidden onchange="handleQuestionContentImage(this,'inOpsiC')"></div>
          </div>
          <div class="input-group">
            <label class="ui-label" for="inOpsiD">Opsi D</label>
            <div class="input-wrapper"><div id="inOpsiD" contenteditable="true" role="textbox" data-placeholder="Jawaban D" class="ui-control question-visual-editor"></div></div>
            <div class="question-format-toolbar"><button type="button" onclick="wrapQuestionContent('inOpsiD','<sup>','</sup>','2')">x<sup>2</sup></button><button type="button" onclick="wrapQuestionContent('inOpsiD','<sub>','</sub>','2')">x<sub>2</sub></button><button type="button" onclick="insertQuestionEquation('inOpsiD')">Equation</button><button type="button" aria-label="Tambah gambar opsi D" onclick="document.getElementById('inOpsiDImage').click()"><i class="fa-solid fa-image"></i> Gambar</button><input type="file" id="inOpsiDImage" accept="image/*,.jfif,.jpe,.dib,.tif,.tiff,.heic,.heif" hidden onchange="handleQuestionContentImage(this,'inOpsiD')"></div>
          </div>
        </div>

        <div class="input-group">
          <label class="ui-label" for="inOpsiE">Opsi E (Opsional)</label>
          <div class="input-wrapper"><div id="inOpsiE" contenteditable="true" role="textbox" data-placeholder="Jawaban E" class="ui-control question-visual-editor"></div></div>
          <div class="question-format-toolbar"><button type="button" onclick="wrapQuestionContent('inOpsiE','<sup>','</sup>','2')">x<sup>2</sup></button><button type="button" onclick="wrapQuestionContent('inOpsiE','<sub>','</sub>','2')">x<sub>2</sub></button><button type="button" onclick="insertQuestionEquation('inOpsiE')">Equation</button><button type="button" aria-label="Tambah gambar opsi E" onclick="document.getElementById('inOpsiEImage').click()"><i class="fa-solid fa-image"></i> Gambar</button><input type="file" id="inOpsiEImage" accept="image/*,.jfif,.jpe,.dib,.tif,.tiff,.heic,.heif" hidden onchange="handleQuestionContentImage(this,'inOpsiE')"></div>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
          <div class="input-group">
            <label class="ui-label" for="inJawabanBenar">Kunci Jawaban</label>
            <div class="input-wrapper"><select id="inJawabanBenar" class="ui-control"><option value="A">Opsi A</option><option value="B">Opsi B</option><option value="C">Opsi C</option><option value="D">Opsi D</option><option value="E">Opsi E</option></select></div>
          </div>
          <div class="input-group">
            <label class="ui-label" for="inPoinSoal">Poin Soal</label>
            <div class="input-wrapper"><input type="number" id="inPoinSoal" value="1" required style="padding-left:12px" class="ui-control"></div>
          </div>
        </div>

        <details open class="question-form-preview"><summary><b>Preview Soal</b></summary><div id="questionFormPreview" class="question-import-card"></div></details>
        <div class="modal-actions"><button type="button" class="ui-button btn btn-secondary" onclick="document.getElementById('modalSoal').classList.remove('show')">Batal</button><button type="submit" class="ui-button btn btn-primary">Simpan Soal</button></div>
      </form>
    </div>
  </div>

  <div class="modal" id="modalDetailSoal">
    <div class="modal-content" style="width:min(660px, 94%); max-height:90vh; overflow-y:auto;">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:16px;">

      </div>
    </div>
