  <div class="modal" id="modalCustomAlert">
    <div class="modal-content" style="width:min(400px, 92%); text-align:center; padding:24px;">
      <div id="alertIconContainer" style="width:54px; height:54px; background:#fef2f2; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 16px; color:var(--danger); font-size:24px; transition:all 0.2s;">
        <i id="alertIcon" class="fa-solid fa-circle-xmark"></i>
      </div>
      <h3 style="font-size:16px; font-weight:800; margin-bottom:6px; color:var(--text-main);" id="alertTitle">Informasi Sistem</h3>
      <div id="alertBadgeCategory" style="font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:12px;">Notifikasi</div>
      <div style="background:var(--surface-subtle); border:1px solid var(--border); border-radius:8px; padding:12px; margin-bottom:20px;">
        <p style="font-size:13px; color:var(--text-main); margin:0; line-height:1.5; word-break:break-word;" id="alertMessage">-</p>
      </div>
      <button class="btn btn-primary" style="width:100%; padding:10px; font-size:13px; font-weight:700;" onclick="document.getElementById('modalCustomAlert').classList.remove('show')">Mengerti</button>
    </div>
  </div>
