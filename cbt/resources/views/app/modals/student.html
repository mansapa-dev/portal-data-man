  <!-- MODAL EDIT SISWA -->
  <div class="modal" id="modalSiswaSatuan">
    <div class="modal-content" style="width:min(450px, 92%);">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h3 style="font-size:16px; font-weight:800;" id="titleModalSiswa">Edit PIN Siswa</h3>
        <button type="button" style="background:none; border:none; font-size:20px; cursor:pointer; color:var(--text-muted);" onclick="document.getElementById('modalSiswaSatuan').classList.remove('show')">&times;</button>
      </div>
      <form id="formSiswaSatuan">
        <input type="hidden" id="editSiswaId">
        <div class="input-group"><label>NISN (Nomor Peserta)</label><div class="input-wrapper"><input type="text" id="inSiswaNo" placeholder="NISN" readonly style="background:var(--surface-subtle);"></div></div>
        <div class="input-group"><label>Nama Lengkap</label><div class="input-wrapper"><input type="text" id="inSiswaNama" placeholder="Nama siswa" readonly style="background:var(--surface-subtle);"></div></div>
        <div class="input-group"><label>Kelas / Rombel</label><div class="input-wrapper"><input type="text" id="inSiswaKelas" placeholder="Kelas" readonly style="background:var(--surface-subtle);"></div></div>
        <div class="input-group"><label>PIN CBT Siswa</label><div class="input-wrapper"><input type="text" id="inSiswaPin" maxlength="6" placeholder="Kosongkan untuk generate acak 4 digit"></div></div>
        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:8px;">Simpan PIN Siswa</button>
      </form>
    </div>
  </div>

  <!-- MODAL GENERATE PIN OTOMATIS MASSAL -->
  <div class="modal" id="modalGeneratePinMassal">
    <div class="modal-content" style="width:min(460px, 92%);">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <div style="display:flex; align-items:center; gap:10px;">
          <div style="width:36px; height:36px; border-radius:8px; background:var(--primary-soft); color:var(--primary-dark); display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:800;">
            <i class="fa-solid fa-key"></i>
          </div>
          <div>
            <h3 style="font-size:15.5px; font-weight:800; color:var(--text-main); margin:0;">Generate PIN Otomatis</h3>
            <small style="color:var(--text-muted); font-size:11px;">Pembuatan PIN massal untuk peserta ujian</small>
          </div>
        </div>
        <button type="button" style="background:none; border:none; font-size:20px; cursor:pointer; color:var(--text-muted);" onclick="document.getElementById('modalGeneratePinMassal').classList.remove('show')">&times;</button>
      </div>

      <div style="background:var(--surface-subtle); border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-bottom:16px; font-size:12.5px; color:var(--text-main); line-height:1.45;">
        <i class="fa-solid fa-circle-info" style="color:var(--primary); margin-right:4px;"></i>
        Sistem akan membuat <b>PIN acak 4 digit</b> baru secara otomatis untuk target siswa yang dipilih. PIN lama akan diperbarui.
      </div>

      <form id="formGeneratePinMassal" onsubmit="eksekusiGeneratePinMassal(event)">
        <div class="input-group">
          <label style="font-size:12px; font-weight:700;">Pilih Target Siswa:</label>
          <div class="input-wrapper">
            <select id="selScopeGeneratePin" style="padding:10px; font-size:13px;" onchange="updateScopeInfoGeneratePin()">
              <option value="CURRENT_FILTER">Siswa yang Sedang Difilter Saat Ini</option>
              <option value="ALL">Seluruh Siswa Aktif (Semua Tingkat)</option>
              <option value="GRADE_X">Khusus Siswa Tingkat X</option>
              <option value="GRADE_XI">Khusus Siswa Tingkat XI</option>
              <option value="GRADE_XII">Khusus Siswa Tingkat XII</option>
            </select>
          </div>
        </div>

        <div id="boxTargetInfoGeneratePin" style="background:var(--primary-soft); border:1px solid var(--primary-soft-border); border-radius:8px; padding:10px 12px; margin-bottom:16px; font-size:12px; color:var(--primary-dark); font-weight:600;">
          Target: Seluruh siswa yang memenuhi kriteria filter aktif.
        </div>

        <div style="display:flex; gap:8px;">
          <button type="button" class="btn btn-secondary" style="flex:1;" onclick="document.getElementById('modalGeneratePinMassal').classList.remove('show')">Batal</button>
          <button type="submit" id="btnGeneratePinMassal" class="btn btn-primary" style="flex:2;"><i class="fa-solid fa-bolt"></i> Mulai Generate PIN</button>
        </div>
      </form>
    </div>
  </div>
