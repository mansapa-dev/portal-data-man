      <!-- TAB ADMIN: KELOLA SOAL (HIERARKI 2-LEVEL: KATALOG MAPEL -> DETAIL SOAL) -->
      <div id="tabAdminSoal" class="dash-tab hidden">
        
        <!-- ================= LEVEL 1: KATALOG MATA PELAJARAN ================= -->
        <div id="viewKatalogMapel">
          <div class="card">
            <div class="card-header">
              <div>
                <div class="card-title"><i class="fa-solid fa-layer-group" style="color:var(--primary);"></i> Katalog Bank Soal Mata Pelajaran</div>
                <div class="card-subtitle">Pilih mata pelajaran di bawah untuk mengelola butir soal, filter tingkatan, dan import file Excel</div>
              </div>
              <div style="display:flex; gap:8px; flex-wrap:wrap;">
                <button class="btn btn-warning" onclick="downloadTemplateSoal()"><i class="fa-solid fa-download"></i> Template Excel (Bisa Gambar)</button>
                <button class="btn btn-success" onclick="document.getElementById('fileImportSoalGlobal').click()"><i class="fa-solid fa-file-arrow-up"></i> Upload Excel Soal</button>
                <input type="file" id="fileImportSoalGlobal" accept=".xlsx, .xls" style="display:none" onchange="handleImportSoal(this)">
                <button class="btn btn-primary" onclick="bukaModalSoal()"><i class="fa-solid fa-plus"></i> Tambah Soal</button>
              </div>
            </div>

            <!-- FILTER KATALOG MAPEL -->
            <div class="filter-bar-grid" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:12px; margin-bottom:18px; background:var(--surface-subtle); padding:14px; border-radius:10px; border:1px solid var(--border);">
              <div>
                <label style="font-size:11px; font-weight:700; color:var(--text-muted); display:block; margin-bottom:4px;">Filter Tingkatan:</label>
                <select id="fltKatalogTingkat" onchange="applyFilterKatalogMapel()" style="width:100%; padding:8px 10px; border-radius:8px; border:1.5px solid var(--border); font-size:12.5px; background:var(--surface);">
                  <option value="ALL">Semua Tingkat (X, XI, XII)</option>
                  <option value="X">Tingkat X</option>
                  <option value="XI">Tingkat XI</option>
                  <option value="XII">Tingkat XII</option>
                </select>
              </div>
              <div>
                <label style="font-size:11px; font-weight:700; color:var(--text-muted); display:block; margin-bottom:4px;">Cari Mata Pelajaran:</label>
                <div style="position:relative;">
                  <i class="fa-solid fa-search" style="position:absolute; left:10px; top:50%; transform:translateY(-50%); font-size:12px; color:var(--text-muted);"></i>
                  <input type="text" id="searchKatalogMapel" placeholder="Cari nama mapel atau kode..." onkeyup="applyFilterKatalogMapel()" style="width:100%; padding:8px 10px 8px 30px; border-radius:8px; border:1.5px solid var(--border); font-size:12.5px; background:var(--surface);">
                </div>
              </div>
            </div>

            <!-- GRID KARTU MATA PELAJARAN -->
            <div id="gridKatalogMapelContainer" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap:16px;">
              <div style="text-align:center; padding:30px; color:var(--text-muted); font-size:13px; grid-column:1/-1;">
                <i class="fa-solid fa-spinner fa-spin" style="font-size:20px; color:var(--primary); margin-bottom:8px; display:block;"></i>
                Memuat katalog mata pelajaran...
              </div>
            </div>
          </div>
        </div>

        <!-- ================= LEVEL 2: DETAIL BANK SOAL PER MAPEL ================= -->
        <div id="viewDetailMapelSoal" class="hidden">
          <div class="card">
            <!-- BACK BUTTON & HEADER -->
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:10px;">
              <button type="button" class="btn btn-secondary" onclick="kembaliKeKatalogMapel()" style="font-weight:700; gap:6px;">
                <i class="fa-solid fa-arrow-left"></i> Kembali ke Katalog Mapel
              </button>

              <div style="display:flex; gap:8px; flex-wrap:wrap;">
                <button class="btn btn-secondary" onclick="exportExcelMapelAktif()"><i class="fa-solid fa-file-excel"></i> Export Excel</button>
                <button class="btn btn-warning" onclick="downloadTemplateSoal(currentSelectedMapelName)"><i class="fa-solid fa-download"></i> Template Excel Mapel Ini</button>
                <button class="btn btn-success" onclick="document.getElementById('fileImportSoalDetail').click()"><i class="fa-solid fa-file-arrow-up"></i> Upload Excel</button>
                <input type="file" id="fileImportSoalDetail" accept=".xlsx, .xls" style="display:none" onchange="handleImportSoal(this)">
                <button class="btn btn-primary" onclick="bukaModalSoalUntukMapelAktif()"><i class="fa-solid fa-plus"></i> Tambah Soal</button>
              </div>
            </div>

            <!-- BANNER MAPEL AKTIF -->
            <div style="background:var(--primary-soft); border:1px solid var(--primary-soft-border); border-radius:12px; padding:16px 20px; margin-bottom:18px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
              <div style="display:flex; align-items:center; gap:12px;">
                <div style="width:42px; height:42px; border-radius:10px; background:var(--primary); color:#ffffff; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:800;">
                  <i class="fa-solid fa-book-open"></i>
                </div>
                <div>
                  <h3 id="lblDetailMapelTitle" style="font-size:17px; font-weight:800; color:var(--text-main); line-height:1.2;">Mata Pelajaran</h3>
                  <div style="display:flex; gap:6px; align-items:center; margin-top:3px;">
                    <span id="lblDetailMapelCountBadge" class="badge bg-green">0 Soal Tersedia</span>
                    <span id="lblDetailMapelTingkatBadge" class="badge bg-blue">Tingkat X, XI, XII</span>
                  </div>
                </div>
              </div>
            </div>

            <!-- FILTER SOAL KHUSUS MAPEL TERPILIH: Tingkat, Nama Ujian, Kelas, Search -->
            <div class="filter-bar-grid" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap:12px; margin-bottom:16px; background:var(--surface-subtle); padding:14px; border-radius:10px; border:1px solid var(--border);">
              <div>
                <label style="font-size:11px; font-weight:700; color:var(--text-muted); display:block; margin-bottom:4px;">Filter Tingkatan:</label>
                <select id="fltDetailSoalTingkat" onchange="populateDetailSoalFilters(); applyFilterDetailSoal();" style="width:100%; padding:8px 10px; border-radius:8px; border:1.5px solid var(--border); font-size:12.5px; background:var(--surface);">
                  <option value="ALL">Semua Tingkat</option>
                  <option value="X">Tingkat X</option>
                  <option value="XI">Tingkat XI</option>
                  <option value="XII">Tingkat XII</option>
                </select>
              </div>
              <div>
                <label style="font-size:11px; font-weight:700; color:var(--text-muted); display:block; margin-bottom:4px;">Nama / Jadwal Ujian:</label>
                <select id="fltDetailSoalUjian" onchange="applyFilterDetailSoal()" style="width:100%; padding:8px 10px; border-radius:8px; border:1.5px solid var(--border); font-size:12.5px; background:var(--surface);">
                  <option value="ALL">Semua Jadwal Ujian</option>
                </select>
              </div>
              <div>
                <label style="font-size:11px; font-weight:700; color:var(--text-muted); display:block; margin-bottom:4px;">Rombel / Kelas:</label>
                <select id="fltDetailSoalKelas" onchange="applyFilterDetailSoal()" style="width:100%; padding:8px 10px; border-radius:8px; border:1.5px solid var(--border); font-size:12.5px; background:var(--surface);">
                  <option value="ALL">Semua Kelas</option>
                </select>
              </div>
              <div>
                <label style="font-size:11px; font-weight:700; color:var(--text-muted); display:block; margin-bottom:4px;">Pencarian Teks Soal:</label>
                <div style="position:relative;">
                  <i class="fa-solid fa-search" style="position:absolute; left:10px; top:50%; transform:translateY(-50%); font-size:12px; color:var(--text-muted);"></i>
                  <input type="text" id="searchDetailSoal" placeholder="Cari isi pertanyaan / opsi..." onkeyup="applyFilterDetailSoal()" style="width:100%; padding:8px 10px 8px 30px; border-radius:8px; border:1.5px solid var(--border); font-size:12.5px; background:var(--surface);">
                </div>
              </div>
            </div>

            <!-- TABEL BUTIR SOAL MAPEL -->
            <div class="table-responsive">
              <table>
                <thead>
                  <tr>
                    <th style="width:45px;">No</th>
                    <th>Teks Pertanyaan & Gambar</th>
                    <th style="width:200px;">Pilihan Jawaban</th>
                    <th style="width:80px; text-align:center;">Kunci</th>
                    <th style="width:60px; text-align:center;">Poin</th>
                    <th style="width:90px; text-align:center;">Aksi</th>
                  </tr>
                </thead>
                <tbody id="tblDetailSoalMapel">
                  <tr><td colspan="6" align="center" style="padding:24px;">Memuat butir soal...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

      </div>
