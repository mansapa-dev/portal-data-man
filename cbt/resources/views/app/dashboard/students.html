      <!-- TAB ADMIN: KONTROL SISWA & GENERATE PIN OTOMATIS -->
      <div id="tabAdminSiswa" class="dash-tab hidden">
        
        <!-- CARD SINKRONISASI & GENERATE MASSAL -->
        <div class="card" style="margin-bottom:16px;">
          <div class="card-header" style="flex-wrap:wrap; gap:12px;">
            <div>
              <div class="card-title"><i class="fa-solid fa-user-graduate" style="color:var(--primary);"></i> Kontrol Peserta Ujian & Manajemen PIN Siswa</div>
              <div class="card-subtitle">Kelola akses ujian siswa, generate PIN otomatis per rombel/tingkat, dan monitoring status ujian</div>
            </div>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
              <button class="btn btn-secondary" onclick="exportToExcel('data_siswa_cbt.xlsx', 'Siswa', ['NISN / No Peserta', 'Nama Lengkap', 'Kelas', 'Tingkat', 'PIN CBT', 'Tahun Ajaran', 'Status Ujian'], window.cacheSiswaExcel || [])"><i class="fa-solid fa-file-excel"></i> Export Excel</button>
              <button class="btn btn-warning" onclick="bukaModalGeneratePinOtomatis()"><i class="fa-solid fa-key"></i> ⚡ Generate PIN Otomatis</button>
              <button class="btn btn-primary" onclick="sinkronkanSemuaPortalData()"><i class="fa-solid fa-rotate"></i> Sinkronkan Portal Data</button>
            </div>
          </div>

          <!-- FILTER BAR SISWA: Tingkat, Kelas, Status, Urutan Abjad, Pencarian -->
          <div class="filter-bar-grid" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap:12px; margin-bottom:14px; background:var(--surface-subtle); padding:14px; border-radius:10px; border:1px solid var(--border);">
            <div>
              <label style="font-size:11px; font-weight:700; color:var(--text-muted); display:block; margin-bottom:4px;">Tingkatan:</label>
              <select id="fltSiswaTingkat" onchange="if(typeof populateAdminSiswaFilters==='function')populateAdminSiswaFilters(); applyFilterSiswa();" style="width:100%; padding:8px 10px; border-radius:8px; border:1.5px solid var(--border); font-size:12.5px; background:var(--surface);">
                <option value="ALL">Semua Tingkat</option>
                <option value="X">Tingkat X</option>
                <option value="XI">Tingkat XI</option>
                <option value="XII">Tingkat XII</option>
              </select>
            </div>
            <div>
              <label style="font-size:11px; font-weight:700; color:var(--text-muted); display:block; margin-bottom:4px;">Rombel / Kelas:</label>
              <select id="fltSiswaKelas" onchange="applyFilterSiswa()" style="width:100%; padding:8px 10px; border-radius:8px; border:1.5px solid var(--border); font-size:12.5px; background:var(--surface);">
                <option value="ALL">Semua Kelas</option>
              </select>
            </div>
            <div>
              <label style="font-size:11px; font-weight:700; color:var(--text-muted); display:block; margin-bottom:4px;">Status Ujian:</label>
              <select id="fltSiswaStatus" onchange="applyFilterSiswa()" style="width:100%; padding:8px 10px; border-radius:8px; border:1.5px solid var(--border); font-size:12.5px; background:var(--surface);">
                <option value="ALL">Semua Status</option>
                <option value="belum">Belum Mulai</option>
                <option value="berlangsung">Sedang Ujian</option>
                <option value="dihentikan">Dihentikan / Terblokir</option>
              </select>
            </div>
            <div>
              <label style="font-size:11px; font-weight:700; color:var(--text-muted); display:block; margin-bottom:4px;">Urutan Abjad:</label>
              <select id="fltSiswaSort" onchange="applyFilterSiswa()" style="width:100%; padding:8px 10px; border-radius:8px; border:1.5px solid var(--border); font-size:12.5px; background:var(--surface);">
                <option value="nama_asc">Nama (A ➔ Z)</option>
                <option value="nama_desc">Nama (Z ➔ A)</option>
                <option value="nisn_asc">NISN / No Peserta</option>
                <option value="kelas_asc">Kelas (Rombel)</option>
              </select>
            </div>
            <div>
              <label style="font-size:11px; font-weight:700; color:var(--text-muted); display:block; margin-bottom:4px;">Pencarian Siswa:</label>
              <div style="position:relative;">
                <i class="fa-solid fa-search" style="position:absolute; left:10px; top:50%; transform:translateY(-50%); font-size:12px; color:var(--text-muted);"></i>
                <input type="text" id="searchSiswa" placeholder="Cari NISN atau Nama..." onkeyup="applyFilterSiswa()" style="width:100%; padding:8px 10px 8px 30px; border-radius:8px; border:1.5px solid var(--border); font-size:12.5px; background:var(--surface);">
              </div>
            </div>
          </div>

          <!-- QUICK FILTER ABJAD A-Z PILLS -->
          <div style="margin-bottom:14px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
              <label style="font-size:11px; font-weight:700; color:var(--text-muted);"><i class="fa-solid fa-arrow-down-a-z"></i> Filter Huruf Awal Nama (Abjad):</label>
              <span id="lblTotalSiswaTerfilter" style="font-size:11.5px; font-weight:700; color:var(--primary-dark);">0 Siswa Ditemukan</span>
            </div>
            <div id="siswaAbjadPillsContainer" style="display:flex; gap:4px; overflow-x:auto; padding-bottom:6px; -webkit-overflow-scrolling:touch;">
              <!-- Rendered dynamically: SEMUA, A, B, C... Z -->
            </div>
          </div>

          <!-- TABEL DATA SISWA -->
          <div class="table-responsive">
            <table>
              <thead>
                <tr>
                  <th style="width:50px;">No</th>
                  <th>No Peserta (NISN)</th>
                  <th>Nama Lengkap Siswa</th>
                  <th>Rombel / Kelas</th>
                  <th>Tingkat</th>
                  <th>PIN CBT</th>
                  <th>Status Pengerjaan</th>
                  <th style="width:130px; text-align:center;">Aksi Kontrol</th>
                </tr>
              </thead>
              <tbody id="tblAdminSiswa">
                <tr><td colspan="8" align="center" style="padding:24px;">Memuat data siswa...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
