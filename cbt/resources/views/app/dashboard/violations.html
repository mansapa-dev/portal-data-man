      <!-- TAB ADMIN: LOG PELANGGARAN -->
      <div id="tabAdminLogPelanggaran" class="dash-tab hidden">
        <div class="card">
          <div class="card-header">
            <div class="card-title">Log Monitoring Kecurangan & Pelanggaran Siswa</div>
            <div style="display:flex; gap:8px;">
              <button class="btn btn-secondary" onclick="exportToExcel('log_pelanggaran_cbt.xlsx', 'Pelanggaran', ['Nomor Ujian', 'Nama Siswa', 'Kelas', 'Nama Ujian', 'Jumlah', 'Keterangan', 'Waktu'], window.cachePelanggaranExcel || [])"><i class="fa-solid fa-file-excel"></i> Export Excel</button>
              <button class="btn btn-secondary" onclick="loadDataAdminLogPelanggaran()"><i class="fa-solid fa-rotate-right"></i> Refresh</button>
            </div>
          </div>
          <div class="filter-bar-grid" style="display:grid; grid-template-columns:repeat(auto-fit,minmax(155px,1fr)); gap:10px; margin-bottom:14px; padding:13px; border:1px solid var(--border); border-radius:10px; background:var(--surface-subtle);">
            <input id="fltPelanggaranTanggal" type="date" class="form-control" onchange="applyFilterPelanggaran()" title="Filter tanggal">
            <select id="fltPelanggaranTingkat" class="form-control" onchange="applyFilterPelanggaran()"><option value="ALL">Semua Tingkat</option></select>
            <select id="fltPelanggaranKelas" class="form-control" onchange="applyFilterPelanggaran()"><option value="ALL">Semua Kelas</option></select>
            <select id="fltPelanggaranUjian" class="form-control" onchange="applyFilterPelanggaran()"><option value="ALL">Semua Ujian / Mapel</option></select>
            <select id="fltPelanggaranJenis" class="form-control" onchange="applyFilterPelanggaran()"><option value="ALL">Semua Jenis Pelanggaran</option></select>
            <div class="search-box" style="margin:0;"><i class="fa-solid fa-search"></i><input type="text" id="searchPelanggaran" placeholder="Cari siswa / NISN..." onkeyup="applyFilterPelanggaran()"></div>
          </div>
          <div class="table-responsive">
            <table>
              <thead><tr><th>Waktu</th><th>No Peserta</th><th>Nama Siswa</th><th>Kelas</th><th>Ujian</th><th>Pelanggaran</th><th>Keterangan</th></tr></thead>
              <tbody id="tblAdminLogPelanggaran"><tr><td colspan="7" align="center">Memuat log...</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
